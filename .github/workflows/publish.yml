name: Import GitDock source and publish Windows build
on:
  push:
    paths:
      - ".gitdock-import/source.tar.xz"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Import complete application source
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .gitdock-import/source.tar.xz ]; then
            echo "Source import archive missing; nothing to import."
            exit 1
          fi
          tar -xJf .gitdock-import/source.tar.xz
          rm -rf .gitdock-import
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete GitDock v1.2 source" || true
          git push origin HEAD:main
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build unsigned Windows setup EXE
        shell: bash
        run: |
          set -euo pipefail
          cd launcher
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-H=windowsgui -s -w" -o ../Commodious-GitDock-Setup.exe .
      - name: Publish v1.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.2 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload v1.2 Commodious-GitDock-Setup.exe --repo "${{ github.repository }}" --clobber
          else
            gh release create v1.2 Commodious-GitDock-Setup.exe --repo "${{ github.repository }}" --title "Commodious GitDock v1.2" --notes "Linked Projects, Smart Sync, and one-click Windows installation. The EXE is unsigned; Windows may display an unknown-publisher warning. GitDock may install Node.js, Git and GitHub CLI with winget."
          fi
