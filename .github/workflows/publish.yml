name: Publish GitDock v1.2 for Windows

on:
  push:
    paths:
      - ".gitdock-import/source.tar.xz"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Import GitDock source
        shell: bash
        run: |
          set -euo pipefail
          archive=".gitdock-import/source.tar.xz"
          test -f "$archive" || { echo "Missing source import archive"; exit 1; }
          tar --exclude=README.md -xJf "$archive"
          test -f server.js
          test -f launcher/main.go
          rm -rf .gitdock-import
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish GitDock v1.2 application source"
            git push origin HEAD:main
          fi
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build Windows EXE
        shell: bash
        run: |
          set -euo pipefail
          cd launcher
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-H=windowsgui -s -w" -o ../Commodious-GitDock-Setup.exe .
          test -s ../Commodious-GitDock-Setup.exe
      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.2 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload v1.2 Commodious-GitDock-Setup.exe --repo "${{ github.repository }}" --clobber
          else
            gh release create v1.2 Commodious-GitDock-Setup.exe --repo "${{ github.repository }}" --target main --title "Commodious GitDock v1.2" --notes "One-click Windows installer, drag-and-drop GitHub publishing, Linked Projects, and Smart Sync. Unsigned executable; Windows may show an unknown-publisher warning. GitDock may install Git, Node.js and GitHub CLI through winget."
          fi
